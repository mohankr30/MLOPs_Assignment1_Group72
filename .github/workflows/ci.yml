name: CI Pipeline - Heart Disease MLOps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint code (flake8)
      run: |
        flake8 app.py train_model.py || true

    - name: Run unit tests
      run: |
        pytest test/test_model.py

    - name: Train model
      run: |
        python train_model.py

    - name: Upload trained model artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: artifacts/heart_model.pkl
